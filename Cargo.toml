[package]
name = "faceauth"
version = "0.1.0"
edition = "2024"
description = "Face authentication system for Linux using OpenVINO/ONNX"
license = "MIT"
authors = ["Vlad Wild <ya.vlash1@yandex.ru>"]

[dependencies]
opencv = { version = "0.98.2", default-features = false, features = ["clang-runtime", "imgproc", "videoio", "objdetect"] }
ndarray = "0.16"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
clap = { version = "4.0", features = ["derive"] }
anyhow = "1.0"
log = "0.4"
image = "0.25"
walkdir = "2.5"
config = "0.14"
dirs = "5.0"
libc = "0.2"
nix = "0.28"
pam = "0.7"
chrono = { version = "0.4", features = ["serde"] }
rand = "0.9"
tract-onnx = "0.22"
syslog = "6.1"
lazy_static = "1.4"
iced = { version = "0.14", features = ["image", "tokio"] }

[dev-dependencies]
tempfile = "3.10"

[[bin]]
name = "faceauth-auth"
path = "src/bin/auth.rs"

[[bin]]
name = "faceauth-ui"
path = "src/bin/faceauth-ui.rs"

[profile.release]
opt-level = 3
