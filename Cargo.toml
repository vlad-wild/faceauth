[package]
name = "faceauth"
version = "0.3.0"
edition = "2024"
description = "Face authentication system for Linux using OpenVINO/ONNX"
license = "MIT"
authors = ["Vlad Wild <ya.vlash1@yandex.ru>"]

[dependencies]
opencv = { version = "0.101", default-features = false, features = ["clang-runtime", "imgproc", "videoio", "objdetect", "xobjdetect"] }
ndarray = "0.16"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
clap = { version = "4.0", features = ["derive"] }
anyhow = "1.0"
log = "0.4"
dirs = "5.0"
libc = "0.2"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
tract-onnx = "0.22"
iced = { version = "0.14", features = ["image", "tokio"] }
openvino = { version = "0.11", optional = true, features = ["runtime-linking"] }

[features]
default = ["openvino"]
openvino = ["dep:openvino"]

[dev-dependencies]
tempfile = "3.10"

[[bin]]
name = "faceauth-auth"
path = "src/bin/auth.rs"

[[bin]]
name = "faceauthd"
path = "src/bin/faceauthd.rs"

[[bin]]
name = "faceauth-ui"
path = "src/bin/ui/main.rs"

[profile.release]
opt-level = 3
